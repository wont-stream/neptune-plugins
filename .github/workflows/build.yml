name: "Validate & Build"

on:
  workflow_call:

jobs:
  Sanity:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies 📥
        run: bun install --no-frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luna-artifacts
          path: ./dist
