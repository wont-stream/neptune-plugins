<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIDAL Remote</title>
  <link href="https://cdn.jsdelivr.net/npm/beercss@3.11.33/dist/cdn/beer.min.css" rel="stylesheet">
  <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.11.33/dist/cdn/beer.min.js"></script>
  <script type="module"
    src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.2/dist/cdn/material-dynamic-colors.min.js"></script>
<script>document.addEventListener("DOMContentLoaded",()=>{let s=new WebSocket(`${location.protocol.replace("http","ws")}//${location.host}`);s.onopen=()=>{console.log("WebSocket connection established"),s.send(JSON.stringify({op:2,data:{type:"request"}}))},s.onmessage=(i)=>{let{op:m,data:h}=JSON.parse(i.data);if(m===0)return s.send(JSON.stringify({op:0}));else if(m===1)return L(h);else if(m===2)return},s.onclose=()=>{console.log("WebSocket connection closed"),location.reload()};let j=document.getElementById("album-art"),y=document.getElementById("track-title"),_=document.getElementById("track-artist"),b=document.getElementById("progress-bar"),n=document.getElementById("shuffle"),x=document.getElementById("skip-previous"),p=document.getElementById("play"),F=document.getElementById("skip-next"),l=document.getElementById("repeat"),e=document.getElementById("play-icon"),c=document.getElementById("repeat-icon"),d,L=async(i)=>{d=i;let m=i.track.album.cover.replaceAll("-","/");if(j.src!==`https://resources.tidal.com/images/${m}/80x80.jpg`)ui("theme",`https://resources.tidal.com/images/${m}/80x80.jpg`),j.src=`https://resources.tidal.com/images/${m}/80x80.jpg`,j.srcset=`https://resources.tidal.com/images/${m}/80x80.jpg 80w, https://resources.tidal.com/images/${m}/160x160.jpg 160w, https://resources.tidal.com/images/${m}/320x320.jpg 320w, https://resources.tidal.com/images/${m}/640x640.jpg 640w, https://resources.tidal.com/images/${m}/1280x1280.jpg 1280w`;if(y.textContent!==i.track.title)y.textContent=i.track.title;if(_.textContent!==i.track.artists.map((h)=>h.name).join(", "))_.textContent=i.track.artists.map((h)=>h.name).join(", ");if(b.value!==i.playState.realPlayTime)b.value=i.playState.realPlayTime;if(b.max!==i.track.duration)b.max=i.track.duration;if(i.playState.shuffle&&n.classList.contains("border"))n.classList.remove("border");else if(!i.playState.shuffle&&!n.classList.contains("border"))n.classList.add("border");if(i.playState.playing&&e.textContent==="play_arrow")e.textContent="pause";else if(!i.playState.playing&&e.textContent==="pause")e.textContent="play_arrow";if(i.playState.repeatMode===0&&c.textContent!=="repeat")c.textContent="repeat",l.classList.add("border");else if(i.playState.repeatMode===1&&l.classList.contains("border"))c.textContent="repeat",l.classList.remove("border");else if(i.playState.repeatMode===2&&c.textContent!=="repeat_one")c.textContent="repeat_one",l.classList.remove("border");setTimeout(()=>{s.send(JSON.stringify({op:2,data:{type:"request"}}))},1000)};n.onclick=()=>{s.send(JSON.stringify({op:2,data:{type:"shuffle",shuffle:!d.playState.shuffle}}))},x.onclick=()=>{s.send(JSON.stringify({op:2,data:{type:"previous"}}))},p.onclick=()=>{s.send(JSON.stringify({op:2,data:{type:d.playState.playing?"pause":"play"}}))},F.onclick=()=>{s.send(JSON.stringify({op:2,data:{type:"next"}}))},l.onclick=()=>{s.send(JSON.stringify({op:2,data:{type:"repeat",mode:(d.playState.repeatMode+1)%3}}))},b.addEventListener("click",(i)=>{let m=b.getBoundingClientRect(),h=i.clientX-m.left,R=Math.min(Math.max(h/m.width,0),1)*b.max;s.send(JSON.stringify({op:2,data:{type:"seek",time:R}}))})});
</script></head>

<body>
  <nav class="bottom">
    <button id="shuffle" class="border">
      <i>shuffle</i>
    </button>
    <button id="skip-previous">
      <i>skip_previous</i>
    </button>
    <button id="play">
      <i id="play-icon">play_arrow</i>
    </button>
    <button id="skip-next">
      <i>skip_next</i>
    </button>
    <button id="repeat" class="border">
      <i id="repeat-icon">repeat</i>
    </button>
  </nav>
  <main class="max absolute center middle center-align">
    <img id="album-art" src="" class="small-height rounded" />
    <h5 id="track-title">...</h5>
    <h6 id="track-artist">...</h6>
    <br />
    <progress id="progress-bar" style="width: 60dvw; height: 2dvh;"></progress>

  </main>
  
</body>

</html>
